services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rag"]
      interval: 5s
      retries: 10

  litellm:
    profiles: ["gateway"]   # not started by `docker compose up -d db`; use --profile gateway
    # Pin by digest before deploying anywhere real; do not track a floating tag.
    image: ghcr.io/berriai/litellm:${LITELLM_TAG:-pin-a-reviewed-release}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      DATABASE_URL: postgresql://app:app@db:5432/litellm
      AWS_REGION_NAME: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      BEDROCK_CHAT_MODEL: ${BEDROCK_CHAT_MODEL:-}
      BEDROCK_EMBED_MODEL: ${BEDROCK_EMBED_MODEL:-amazon.titan-embed-text-v2:0}
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
      - ~/.aws:/root/.aws:ro # local dev only; deployed gateway uses its task IAM role
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
